name: Dev CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Build Docker image and save logs to a file
      - name: Build Docker image
        id: docker_build
        env:
          ENV: ${{ secrets.ENV }}
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=1

          SHORT_SHA=${GITHUB_SHA:0:8}
          AWS_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

          docker build \
            -t ${AWS_REGISTRY}/design-flow-app:latest \
            -t ${AWS_REGISTRY}/design-flow-app:sha-${SHORT_SHA} \
            . 2>&1 | tee output.txt
        continue-on-error: true

      # Set status and log based on the outcome of the 'docker_build' step
      - name: Set Docker Build status and log
        id: docker_status
        if: always()
        run: |
          if [[ "${{ steps.docker_build.outcome }}" == "success" ]]; then
            echo "DOCKER_STATUS=Succeeded" >> $GITHUB_ENV
            echo "DOCKER_STATUS_ICON=✅" >> $GITHUB_ENV
            echo "DOCKER_MAKER_STATUS=:white_check_mark:" >> $GITHUB_ENV
            echo "DOCKER_STATUS_MSG=Docker build succeeded" >> $GITHUB_ENV
            echo "DOCKER_RUN_LOG=🎉 Docker build completed successfully with no errors." >> $GITHUB_ENV
          else
            echo "DOCKER_STATUS=Failed" >> $GITHUB_ENV
            echo "DOCKER_STATUS_ICON=🚨" >> $GITHUB_ENV
            echo "DOCKER_STATUS_MSG=Docker build failed" >> $GITHUB_ENV
            echo "DOCKER_MAKER_STATUS=:x:" >> $GITHUB_ENV
            echo "DOCKER_RUN_LOG<<EOF" >> $GITHUB_ENV
            tail -n 20 output.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      # Log in to Amazon ECR (only if Docker build succeeded)
      - name: Log in to Amazon ECR
        if: env.DOCKER_STATUS == 'Succeeded'
        uses: aws-actions/amazon-ecr-login@v2

      # Push Docker image to ECR
      - name: Push Docker image to ECR
        if: env.DOCKER_STATUS == 'Succeeded'
        id: ecr_push
        run: |
          set -euo pipefail
          AWS_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          SHORT_SHA=${GITHUB_SHA:0:8}

          echo "Pushing images to ECR..."
          docker push ${AWS_REGISTRY}/design-flow-app:latest 2>&1 | tee ecr_push_output.txt
          docker push ${AWS_REGISTRY}/design-flow-app:sha-${SHORT_SHA} 2>&1 | tee -a ecr_push_output.txt

          echo "✅ Both images pushed successfully"
        continue-on-error: true

      # Set ECR Push status and log
      - name: Set ECR Push status and log
        id: ecr_status
        if: always()
        run: |
          # Check if this step was skipped due to previous failure
          if [[ "${{ env.DOCKER_STATUS }}" == "Failed" ]]; then
            echo "ECR_STATUS=Skipped" >> $GITHUB_ENV
            echo "ECR_STATUS_ICON=⏭️" >> $GITHUB_ENV
            echo "ECR_MAKER_STATUS=:fast_forward:" >> $GITHUB_ENV
            echo "ECR_STATUS_MSG=ECR push skipped" >> $GITHUB_ENV
            echo "ECR_RUN_LOG=ECR push was skipped due to Docker build failure." >> $GITHUB_ENV
          elif [[ "${{ steps.ecr_push.outcome }}" == "success" ]]; then
            echo "ECR_STATUS=Succeeded" >> $GITHUB_ENV
            echo "ECR_STATUS_ICON=✅" >> $GITHUB_ENV
            echo "ECR_MAKER_STATUS=:white_check_mark:" >> $GITHUB_ENV
            echo "ECR_STATUS_MSG=ECR push succeeded" >> $GITHUB_ENV
            echo "ECR_RUN_LOG=🎉 Docker images pushed to ECR successfully." >> $GITHUB_ENV
          else
            echo "ECR_STATUS=Failed" >> $GITHUB_ENV
            echo "ECR_STATUS_ICON=🚨" >> $GITHUB_ENV
            echo "ECR_STATUS_MSG=ECR push failed" >> $GITHUB_ENV
            echo "ECR_MAKER_STATUS=:x:" >> $GITHUB_ENV
            if [ -f "ecr_push_output.txt" ]; then
              echo "ECR_RUN_LOG<<EOF" >> $GITHUB_ENV
              tail -n 20 ecr_push_output.txt >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
            else
              echo "ECR_RUN_LOG=ECR push failed but no logs were captured." >> $GITHUB_ENV
            fi
          fi

      # Trigger deploy (only if Docker build AND ECR push succeeded)
      - name: Trigger deploy and wait for completion
        if: env.DOCKER_STATUS == 'Succeeded' && env.ECR_STATUS == 'Succeeded'
        id: ssm_deploy
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Triggering deployment via GitHub Actions" \
            --parameters '{"commands":["sudo -u ubuntu bash -c \"cd /home/ubuntu/rayda/v3/design-flow-app && bash deploy.sh\""]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Custom polling loop with extended timeout
          echo "Waiting for command to finish..."
          MAX_ATTEMPTS=60  # 60 attempts
          DELAY=10          # 10 seconds between attempts (total 10 minutes max)
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            
            echo "Checking status... (Attempt $ATTEMPT/$MAX_ATTEMPTS)"
            
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Current status: $STATUS"
            
            case "$STATUS" in
              Success)
                echo "Command completed successfully!"
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Command failed with status: $STATUS"
                
                # Fetch and display the error details
                INVOCATION=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.INSTANCE_ID }}" \
                  --output json)
                
                echo "$INVOCATION" | tee ssm_output.txt
                
                # Show error output if available
                echo "Error output:"
                echo "$INVOCATION" | jq -r '.StandardErrorContent // "No error output"'
                
                exit 1
                ;;
              InProgress|Pending|Delayed)
                if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                  echo "Timeout: Command still in progress after $((MAX_ATTEMPTS * DELAY)) seconds"
                  
                  # Fetch current state for debugging
                  INVOCATION=$(aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "${{ secrets.INSTANCE_ID }}" \
                    --output json)
                  
                  echo "$INVOCATION" | tee ssm_output.txt
                  exit 1
                fi
                
                sleep $DELAY
                ;;
              *)
                echo "Unknown status: $STATUS"
                sleep $DELAY
                ;;
            esac
          done

          # Fetch final command result
          echo "Fetching command result..."
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}" \
            --output json)

          echo "$INVOCATION" | tee ssm_output.txt

          # Display the output
          echo "Command output:"
          echo "$INVOCATION" | jq -r '.StandardOutputContent // "No output"'

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          echo "Final command status: $STATUS"
        continue-on-error: true

      # Set SSM Deploy status with cascading skip logic
      - name: Set SSM Deploy status and log
        id: ssm_status
        if: always()
        run: |
          # Check if previous steps failed (cascading skip logic)
          if [[ "${{ env.DOCKER_STATUS }}" == "Failed" ]]; then
            echo "SSM_STATUS=Skipped" >> $GITHUB_ENV
            echo "SSM_STATUS_ICON=⏭️" >> $GITHUB_ENV
            echo "SSM_MAKER_STATUS=:fast_forward:" >> $GITHUB_ENV
            echo "SSM_STATUS_MSG=Deployment skipped" >> $GITHUB_ENV
            echo "SSM_RUN_LOG=Deployment was skipped due to Docker build failure." >> $GITHUB_ENV
          elif [[ "${{ env.ECR_STATUS }}" == "Failed" ]]; then
            echo "SSM_STATUS=Skipped" >> $GITHUB_ENV
            echo "SSM_STATUS_ICON=⏭️" >> $GITHUB_ENV
            echo "SSM_MAKER_STATUS=:fast_forward:" >> $GITHUB_ENV
            echo "SSM_STATUS_MSG=Deployment skipped" >> $GITHUB_ENV
            echo "SSM_RUN_LOG=Deployment was skipped due to ECR push failure." >> $GITHUB_ENV
          elif [[ "${{ env.ECR_STATUS }}" == "Skipped" ]]; then
            echo "SSM_STATUS=Skipped" >> $GITHUB_ENV
            echo "SSM_STATUS_ICON=⏭️" >> $GITHUB_ENV
            echo "SSM_MAKER_STATUS=:fast_forward:" >> $GITHUB_ENV
            echo "SSM_STATUS_MSG=Deployment skipped" >> $GITHUB_ENV
            echo "SSM_RUN_LOG=Deployment was skipped due to previous step failure." >> $GITHUB_ENV
          elif [[ "${{ steps.ssm_deploy.outcome }}" == "success" ]]; then
            echo "SSM_STATUS=Succeeded" >> $GITHUB_ENV
            echo "SSM_STATUS_ICON=✅" >> $GITHUB_ENV
            echo "SSM_MAKER_STATUS=:white_check_mark:" >> $GITHUB_ENV
            echo "SSM_STATUS_MSG=Deployment succeeded" >> $GITHUB_ENV
            echo "SSM_RUN_LOG=🚀 Deployment completed successfully with no errors." >> $GITHUB_ENV
          else
            echo "SSM_STATUS=Failed" >> $GITHUB_ENV
            echo "SSM_STATUS_ICON=🚨" >> $GITHUB_ENV
            echo "SSM_STATUS_MSG=Deployment failed" >> $GITHUB_ENV
            echo "SSM_MAKER_STATUS=:x:" >> $GITHUB_ENV
            if [ -f "ssm_output.txt" ]; then
              echo "SSM_RUN_LOG<<EOF" >> $GITHUB_ENV
              tail -n 20 ssm_output.txt >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
            else
              echo "SSM_RUN_LOG=Deployment failed but no logs were captured." >> $GITHUB_ENV
            fi
          fi

      # Construct Slack Payload with all three stages
      - name: Construct Slack Payload
        id: construct_payload
        if: always()
        run: |
          # Determine overall pipeline status
          if [[ "${{ env.DOCKER_STATUS }}" == "Failed" ]] || \
             [[ "${{ env.ECR_STATUS }}" == "Failed" ]] || \
             [[ "${{ env.SSM_STATUS }}" == "Failed" ]]; then
            OVERALL_STATUS="Failed"
            OVERALL_ICON="🚨"
            OVERALL_MAKER=":x:"
          else
            OVERALL_STATUS="Succeeded"
            OVERALL_ICON="✅"
            OVERALL_MAKER=":white_check_mark:"
          fi

          # Build detailed status section
          DOCKER_STATUS="${{ env.DOCKER_STATUS_ICON }} *Docker Build:* ${{ env.DOCKER_STATUS }}"
          ECR_STATUS="${{ env.ECR_STATUS_ICON }} *ECR Push:* ${{ env.ECR_STATUS }}"
          SSM_STATUS="${{ env.SSM_STATUS_ICON }} *Deployment:* ${{ env.SSM_STATUS }}"

          # Determine which logs to show (only show logs from failed stages, not skipped)
          if [[ "${{ env.DOCKER_STATUS }}" == "Failed" ]]; then
            STAGE_FAILED="Docker Build"
            ERROR_LOGS="${{ env.DOCKER_RUN_LOG }}"
          elif [[ "${{ env.ECR_STATUS }}" == "Failed" ]]; then
            STAGE_FAILED="ECR Push"
            ERROR_LOGS="${{ env.ECR_RUN_LOG }}"
          elif [[ "${{ env.SSM_STATUS }}" == "Failed" ]]; then
            STAGE_FAILED="Deployment"
            ERROR_LOGS="${{ env.SSM_RUN_LOG }}"
          else
            STAGE_FAILED="None"
            ERROR_LOGS="🎉 All stages completed successfully!"
          fi

          # Use jq to build the JSON payload
          PAYLOAD_JSON=$(jq -n \
            --arg status_icon "$OVERALL_ICON" \
            --arg status_text "$OVERALL_STATUS" \
            --arg repo_url "https://github.com/${{ github.repository }}" \
            --arg repo_name "${{ github.repository }}" \
            --arg actor "${{ github.actor }}" \
            --arg branch_name "${{ github.ref_name }}" \
            --arg commit_url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg sha "${{ github.sha }}" \
            --arg overall_maker "$OVERALL_MAKER" \
            --arg docker_status "$DOCKER_STATUS" \
            --arg ecr_status "$ECR_STATUS" \
            --arg ssm_status "$SSM_STATUS" \
            --arg stage_failed "$STAGE_FAILED" \
            --arg error_logs "$ERROR_LOGS" \
            --arg logs_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "\($status_icon) Pipeline \($status_text)"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "image",
                      "image_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                      "alt_text": "GitHub Logo"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:* <\($repo_url)|\($repo_name)>\n*Initiator:* \($actor)\n*Branch:* \($branch_name)\n*Commit:* <\($commit_url)|\($sha[:8])>"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Overall Status:*\n\($overall_maker) \($status_text)"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Pipeline Stages:*\n\($docker_status)\n\($ecr_status)\n\($ssm_status)"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Failed Stage:* \($stage_failed)\n\n*Logs (Last 20 lines):*\n```\n\($error_logs)\n```"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Full Logs"
                      },
                      "url": "\($logs_url)"
                    }
                  ]
                }
              ]
            }')
          echo "payload_json<<EOF" >> $GITHUB_OUTPUT
          echo "$PAYLOAD_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.construct_payload.outputs.payload_json }}
